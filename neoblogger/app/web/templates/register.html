{% extends "base.html" %}
{% block title %}Sign up · {{ site_title }}{% endblock %}
{% block hero_title %}Sign up{% endblock %}
{% block hero_sub %}<p>Read and share new perspectives.</p>{% endblock %}
{% block content %}
{% if questions %}
<form method="post">
  {{ csrf_field() }}
  <label for="display_name">Display name</label>
  <input id="display_name" name="display_name" required maxlength="50">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required minlength="8">
  <label for="question_code">Security question</label>
  <select id="question_code" name="question_code" required>
    {% for code, question in questions %}<option value="{{ code }}">{{ question }}</option>{% endfor %}
  </select>
  <label for="answer">Answer</label>
  <input id="answer" name="answer" required>
  <button type="submit">Create account</button>
</form>
{% endif %}
{% endblock %}
