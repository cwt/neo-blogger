[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neoblogger"
version = "0.1.0"
description = "Self-hosted, article-first, long-form publishing platform."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chaiwat Suttipongsakul", email = "cwt@bashell.com" }]
dependencies = [
  "argon2-cffi>=23",
  "itsdangerous>=2.2",
  "markdown-it-py>=3",
  "neosqlite>=1.17",
  "nh3>=0.2",
  "pillow>=11.3",
  "pydantic>=2.12",
  "pygments>=2.19",
  "quart>=0.20",
]

[project.optional-dependencies]
serve = ["gunicorn>=23", "uvicorn>=0.34"]

[project.scripts]
neoblogger-users = "neoblogger.cli.users:main"
neoblogger-admin-repair = "neoblogger.cli.admin_repair:main"
neoblogger-reindex = "neoblogger.cli.reindex:main"
neoblogger-secret = "neoblogger.cli.secret:main"
neoblogger-theme = "neoblogger.cli.theme:main"

[dependency-groups]
dev = [
  "hypercorn>=0.17",
  "mypy>=1.18",
  "pytest>=9",
  "pytest-asyncio>=1",
  "ruff>=0.13",
  "types-Pygments",
]

[tool.hatch.build.targets.wheel]
packages = ["neoblogger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
extend-exclude = ["tools/spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["neoblogger"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["neoblogger"]

# The engine ships no py.typed marker; its references are Any-typed and are
# contained behind the repository facade (tech-req §5.1).
[[tool.mypy.overrides]]
module = ["neosqlite", "neosqlite.*"]
follow_imports = "skip"
ignore_missing_imports = true
