# Neo-Blogger configuration (tech-req §14).
# Location override: environment variable NEOBLOGGER_CONFIG.
# Every omitted key falls back to the documented default; missing values
# never crash the platform. Unknown keys are rejected at load time so a
# typo can never silently look like a passing boot.

[application]
# REQUIRED in production (https = true); generated by:
#   uv run python -m neoblogger.cli.secret
secret_key = ""
bind = "0.0.0.0"
port = 8000
site_title = "Neo-Blogger"
site_author = ""
site_description = ""
base_url = ""            # https://example.com — normalized with a trailing slash
https = false            # production flag (Secure cookie + HSTS)

[database]
path = "neo-blogger.db"
# Optional tokenizer name — single name only in v1 (tech-req §5.8/Spike S4:
# the two-word "TOKENIZE icu th" clause is not supported).
# Empty string selects the engine default tokenizer.
tokenizer = ""
# Optional absolute path to the tokenizer .so; a missing file means the
# app-owned fallback applies: catch, warn, reconnect without it (§12.2).
tokenizer_library = ""

[caching]
enabled = false
timeout_seconds = 300
storage = "memory"       # "memory" | "file"
directory = "cache"
max_size_mb = 100

[posts]
per_page = 10
max_per_page = 50

[uploads]
max_body_bytes = 16777216
